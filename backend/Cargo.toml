[package]
name = "insulator2"
version = "0.0.0"
description = "A client UI to inspect Kafka topics, consume, produce and much more."
authors = ["Andrea Vinci"]
license = "GPL-3"
repository = "https://github.com/andrewinci/insulator2.git"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# this is required to allow rdkafka to compile in windows
openssl-src = { version = "111", features = ["force-engine"] }

[dependencies]
serde_json = "1.0"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
url = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
futures = { version = "0.3" }
apache-avro = "0.21.0"
log = { version = "0.4" }
env_logger = { version = "0.11" }
async-trait = "0.1"
num-bigint = "0.4"
rust_decimal = "1"
rusqlite = { version = "0.38.0", features = ["bundled", "backup", "hooks"] }
rust-keystore = { git = "https://github.com/andrewinci/rust-keystore", features = [
    "p12",
], tag = "v0.1.2" }
r2d2 = "0.8"
r2d2_sqlite = "0.32.0"
toml = "1.0"
rand = "0.8"
time = "0.3"
sys-locale = "0.3"
uuid = "1"
rlimit = "0.10"

[target.'cfg(windows)'.dependencies]
rdkafka = { version = "0.36", features = [
    "cmake-build",
    "ssl-vendored",
] } #todo: add "gssapi" to use scram on windows

[target.'cfg(unix)'.dependencies]
rdkafka = { version = "0.36", features = [
    "cmake-build",
    "ssl-vendored",
    "gssapi",
] }

[dev-dependencies]
mockall = "0.13"
httpmock = "0.7"
once_cell = "1"

[features]
# Used for integration tests
integration_tests = []

[profile.release]
strip = true
lto = true
opt-level = "s"
